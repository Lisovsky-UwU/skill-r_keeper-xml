name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check.py
      - name: Reference is in sync with schemas and notes
        run: |
          python scripts/xsd_to_reference.py schemas .
          changes="$(git status --porcelain -- references)"
          if [ -n "$changes" ]; then
            echo "references/ is out of date - run: python scripts/xsd_to_reference.py schemas ."
            echo "$changes"
            git diff -- references | head -50
            exit 1
          fi
